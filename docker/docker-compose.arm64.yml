services:
  # Main OrderUp application
  orderup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.arm64 # Use ARM64-compatible Dockerfile
    restart: unless-stopped
    container_name: orderup-app
    env_file:
      - ../.env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-orderup}
      - DB_USER=${DB_USER:-orderup_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - TINI_SUBREAPER=1
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - orderup_network
    volumes:
      - ../server/data:/usr/src/orderup/data:rw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1",
        ]
      interval: ${HEALTH_CHECK_INTERVAL:-60s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-10s}

  # NGINX reverse proxy
  nginx:
    build:
      context: ..
      dockerfile: docker/nginx.dockerfile
    restart: unless-stopped
    container_name: orderup-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      orderup:
        condition: service_healthy
    networks:
      - orderup_network
    volumes:
      - ../nginx-config/orderup.dev.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TINI_SUBREAPER=1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/nginx-health || exit 1",
        ]
      interval: ${HEALTH_CHECK_INTERVAL:-60s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-10s}

  # PostgreSQL database with monitoring extensions
  db:
    build:
      context: ..
      dockerfile: docker/postgres-monitoring.dockerfile
    restart: unless-stopped
    user: postgres
    container_name: orderup-db
    # Preload at server start (also applies to the temporary init-time server);
    # otherwise CREATE EXTENSION pg_stat_statements in the init scripts fails
    # and the schema/restaurant imports never run. pg_stat_monitor (query details and
    # plans) and pg_wait_sampling (wait events) are built into this image
    # (postgres-monitoring.dockerfile). pg_stat_statements goes first, as the
    # pg_wait_sampling README asks.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements,pg_stat_monitor,pg_wait_sampling"]
    env_file:
      - ../.env
    volumes:
      - db-data:/var/lib/postgresql/data
      # Mount application initialization scripts
      - ../db/init/01-init-schema.sql:/docker-entrypoint-initdb.d/10-init-schema.sql:ro
      - ../db/init/02-import-restaurants-uuid.sql:/docker-entrypoint-initdb.d/20-import-restaurants-uuid.sql:ro
      # Mount monitoring scripts for initialization
      - ../db/scripts:/docker-entrypoint-initdb.d/scripts:ro
    environment:
      - POSTGRES_DB=${DB_NAME:-orderup}
      - POSTGRES_USER=${DB_USER:-orderup_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TINI_SUBREAPER=1
      # PostgreSQL monitoring configuration
      - POSTGRES_INITDB_ARGS=--data-checksums
      # Enable additional logging for monitoring
      - POSTGRES_HOST_AUTH_METHOD=md5
    expose:
      - "5432"
    networks:
      - orderup_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d orderup -U orderup_user"]
      interval: ${DB_HEALTH_INTERVAL:-10s}
      timeout: ${DB_HEALTH_TIMEOUT:-5s}
      retries: ${DB_HEALTH_RETRIES:-5}
      start_period: ${DB_HEALTH_START_PERIOD:-60s}

  # New Relic Infrastructure agent: the "bundle" image, which is the agent plus
  # the nginx and PostgreSQL integrations (the plain image has neither). On
  # Docker Desktop the "host" it reports is the Docker VM, not the developer
  # machine. It joins the compose network, not the host's, so it can reach the
  # nginx and db services by name; the cost is that network-interface metrics
  # describe the container, not the VM. The integration configs are mounted
  # from newrelic-integrations/docker/.
  newrelic-infra:
    image: newrelic/infrastructure-bundle:3.6.3
    container_name: orderup-infra
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    privileged: true
    pid: host
    networks:
      - orderup_network
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ../newrelic-integrations/docker:/etc/newrelic-infra/integrations.d:ro
    environment:
      # Read by the PostgreSQL integration config (newrelic-integrations/docker/postgresql-config.yml)
      - DB_NAME=${DB_NAME:-orderup}
      - DB_USER=${DB_USER:-orderup_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - NRIA_LICENSE_KEY=${NRIA_LICENSE_KEY:-${NEW_RELIC_LICENSE_KEY:-your-license-key-here}}
      - NRIA_DISPLAY_NAME=${MONITORING_DISPLAY_NAME:-OrderUp-Infra-Docker-Local}
      - NRIA_VERBOSE=${MONITORING_VERBOSE:-0}
      - NRIA_CUSTOM_ATTRIBUTES={"environment":"local-docker","application":"orderup"}
    depends_on:
      - orderup
      - db
      - nginx

# Docker volumes for persistent data
volumes:
  db-data:
    driver: local
    name: orderup-db-data

# Docker networks
networks:
  orderup_network:
    driver: bridge
    name: orderup_network
